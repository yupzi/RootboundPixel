<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地下分层编辑器</title>
<style>
  :root { --bg: #15101a; --panel: #211a26; --line: #3a2f42; --ink: #e8ddd0; --dim: #9a8ea4; --hi: #fee761; --accent: #7cbf4e; --warn: #e8823e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 "Microsoft YaHei", "PingFang SC", sans-serif; overflow: hidden; }
  button, select, input { font: inherit; color: var(--ink); background: #2c2333; border: 1px solid var(--line); border-radius: 3px; }
  button { padding: 3px 9px; cursor: pointer; }
  button:hover { border-color: #6a5a78; }
  button.on { background: #4a3a20; border-color: var(--hi); color: var(--hi); }
  button.primary { background: #2f4a22; border-color: var(--accent); }
  button.danger:hover { border-color: #e43b44; color: #ff8a8a; }
  input[type=number] { width: 52px; padding: 2px 3px; }
  input[type=text] { padding: 2px 4px; }
  input[type=color] { width: 26px; height: 22px; padding: 0 1px; }
  select { padding: 2px; }
  kbd { font-size: 11px; color: var(--dim); }
  #app { display: grid; grid-template-rows: 42px 1fr 24px; height: 100%; }
  #top { display: flex; align-items: center; gap: 8px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; }
  #top .title { font-weight: bold; color: var(--hi); margin-right: 6px; }
  #top .sep { width: 1px; height: 22px; background: var(--line); }
  #top label { display: flex; align-items: center; gap: 4px; color: var(--dim); }
  #saveState { color: var(--dim); min-width: 120px; }
  #saveState.dirty { color: var(--warn); }
  #main { display: grid; grid-template-columns: 196px 1fr 320px; min-height: 0; }
  .side { background: var(--panel); overflow-y: auto; padding: 8px; }
  #left { border-right: 1px solid var(--line); }
  #right { border-left: 1px solid var(--line); }
  h3 { margin: 10px 0 6px; font-size: 12px; color: var(--dim); font-weight: normal; letter-spacing: 1px; display: flex; justify-content: space-between; align-items: center; }
  h3:first-child { margin-top: 0; }
  #tools { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  #tools button { text-align: left; }
  #palette { display: grid; grid-template-columns: 1fr; gap: 2px; }
  .pal { display: flex; align-items: center; gap: 6px; padding: 2px 4px; border: 1px solid transparent; border-radius: 3px; cursor: pointer; }
  .pal:hover { background: #2c2333; }
  .pal.on { border-color: var(--hi); background: #3a2f20; }
  .pal canvas { width: 20px; height: 20px; image-rendering: pixelated; border: 1px solid #00000080; }
  .pal .k { margin-left: auto; color: var(--dim); font-size: 11px; }
  #view { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
  #cv { position: absolute; inset: 0; display: block; cursor: crosshair; }
  #status { display: flex; gap: 16px; align-items: center; padding: 0 10px; background: var(--panel); border-top: 1px solid var(--line); color: var(--dim); white-space: nowrap; overflow: hidden; }
  #status b { color: var(--ink); font-weight: normal; }
  .row { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
  .row input[type=text] { flex: 1; min-width: 0; }
  .hint { color: var(--dim); font-size: 12px; }
  .list .it { padding: 3px 6px; border: 1px solid transparent; border-radius: 3px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
  .list .it:hover { background: #2c2333; }
  .list .it.on { border-color: var(--hi); background: #3a2f20; }
  .list .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .list .meta { margin-left: auto; color: var(--dim); font-size: 11px; }
  #regEdit { margin-top: 8px; padding: 8px; border: 1px solid var(--line); border-radius: 4px; background: #1b1520; }
  .item { border-top: 1px dashed var(--line); padding: 5px 0 1px; }
  .item select { max-width: 104px; }
  .btns { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  #menu { position: fixed; z-index: 10; background: var(--panel); border: 1px solid #6a5a78; border-radius: 4px; padding: 4px; min-width: 200px; box-shadow: 0 4px 16px #0008; }
  #menu div { padding: 4px 10px; cursor: pointer; border-radius: 3px; }
  #menu div:hover { background: #3a2f42; }
  #menu .cap { color: var(--dim); cursor: default; font-size: 12px; }
  #menu .cap:hover { background: none; }
  #toast { position: fixed; left: 50%; top: 52px; transform: translateX(-50%); background: #2f4a22; border: 1px solid var(--accent); padding: 6px 14px; border-radius: 4px; pointer-events: none; opacity: 0; transition: opacity .25s; z-index: 20; }
  #toast.err { background: #4a2222; border-color: #e43b44; }
  #toast.show { opacity: 1; }
  .layer { padding: 4px 0 2px; border-bottom: 1px dashed var(--line); }
  .layer .flora { padding-left: 4px; }
  .layer .flora .row { gap: 3px; margin-bottom: 3px; }
  .layer .flora input[type=number] { width: 44px; }
  .layer .flora .hint { white-space: nowrap; }
  .layer .flora .sw { width: 9px; height: 9px; border-radius: 2px; flex: none; margin-left: 4px; }
  .layer .flora .sw:first-child { margin-left: 0; }
  .layer .flora button { padding: 1px 6px; margin-left: auto; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span class="title">地下分层编辑器</span><span class="hint" id="lvName"></span>
    <span class="sep"></span>
    <button id="btnSave" class="primary" title="写回 js/strata.js (Ctrl+S)">保存</button>
    <span id="saveState">已保存</span>
    <button id="btnExport" title="导出 / 导入">导出 ▾</button>
    <span class="sep"></span>
    <button id="btnUndo" title="Ctrl+Z">撤销</button><button id="btnRedo" title="Ctrl+Y / Ctrl+Shift+Z">重做</button>
    <span class="sep"></span>
    <button id="btnZoomOut" title="Ctrl+滚轮">−</button><span id="zoomTxt"></span><button id="btnZoomIn">+</button>
    <label><input type="checkbox" id="chkGrid" checked>网格</label>
    <label><input type="checkbox" id="chkRegions" checked>区域框</label>
    <span class="sep"></span>
    <label>试玩植物 <select id="selSp"></select></label>
    <button id="btnPlay" title="从地表开始，在试验场里自己走过去种 (P)">▶ 试玩</button>
    <span class="hint">右键地图：从这里试玩</span>
  </div>
  <div id="main">
    <div id="left" class="side">
      <h3>工具</h3>
      <div id="tools"></div>
      <div class="row" style="margin-top:6px"><span class="hint" style="white-space:nowrap">画笔大小</span><input type="range" id="brush" min="1" max="24" value="3" style="flex:1;min-width:0"><span id="brushTxt">3</span></div>
      <div class="hint">[ ] 调大小 · Alt+点击 吸取 · Shift+拖动 擦掉手绘 · 空格/中键拖动平移</div>
      <h3>方块</h3>
      <div id="palette"></div>
    </div>
    <div id="view"><canvas id="cv"></canvas></div>
    <div id="right" class="side">
      <h3>分层 <button id="btnAddLayer" title="在视图中间的深度加一层">+ 分层</button></h3>
      <div class="hint" style="margin-bottom:6px">每层从「起始行」一直到下一层。层与层之间的屏障用方块铺（基岩只有破障能过、熔岩要防火、岩石硬撞扣时间）。</div>
      <div id="layers"></div>
      <h3>随机生成区域 <span class="hint">工具「区域」拖出新区域</span></h3>
      <div id="regions" class="list"></div>
      <div id="regEdit" class="hidden"></div>
    </div>
  </div>
  <div id="status"><span>行 <b id="stRow">-</b> 列 <b id="stCol">-</b></span><span>方块 <b id="stTile">-</b></span><span>分层 <b id="stLayer">-</b></span><span>区域 <b id="stReg">-</b></span><span id="stHint" class="hint"></span></div>
</div>
<div id="menu" class="hidden"></div>
<div id="toast"></div>

<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/strata.js"></script>
<script src="js/strata_gen.js"></script>
<script src="js/sprites.js"></script>
<script src="js/art.js"></script>
<script src="js/pixel.js"></script>
<script src="js/tree.js"></script>
<script src="js/tree_art.js"></script>
<script src="js/field.js"></script>
<script src="js/render.js"></script>
<script src="js/editor.js"></script>
</body>
</html>
